services:
  - type: web
    name: ecomm-backend
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn ecomm.wsgi:application"
    rootDir: backend
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ecomm-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".render.com"

  - type: web
    name: ecomm-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    plan: free
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: ecomm-backend
          property: host

databases:
  - name: ecomm-db
    plan: free
