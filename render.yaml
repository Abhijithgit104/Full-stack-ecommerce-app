services:
  - type: web
    name: ecomm-api
    env: python
    buildCommand: "sed -i 's/\\r$//' build.sh && bash build.sh"
    startCommand: "gunicorn ecomm.wsgi:application --preload --workers 1 --threads 4 --timeout 120 --keep-alive 5"
    rootDir: backend
    plan: free
    envVars:
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ALLOWED_HOSTS
        value: "*"
