services:
  - type: web
    name: ecomm-backend
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn ecomm.wsgi:application"
    rootDir: backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ecomm-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".render.com"

databases:
  - name: ecomm-db
